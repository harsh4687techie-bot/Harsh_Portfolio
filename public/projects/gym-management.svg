<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="gm-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="60%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="gm-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#gm-bg)" rx="16"/>
  <!-- Decorative Gym Weight Silhouette in Background -->
  <g opacity="0.15" stroke="#38BDF8" stroke-width="4" fill="none">
    <circle cx="120" cy="250" r="60" />
    <circle cx="120" cy="250" r="40" />
    <line x1="120" y1="250" x2="680" y2="250" stroke-width="12" stroke-linecap="round" />
    <circle cx="680" cy="250" r="60" />
    <circle cx="680" cy="250" r="40" />
  </g>
  <!-- Main Frame -->
  <rect x="150" y="80" width="500" height="340" rx="14" fill="#0F172A" stroke="#334155" stroke-width="1.5" />
  <!-- Frame Header -->
  <rect x="150" y="80" width="500" height="46" rx="14" fill="#1E293B" />
  <circle cx="180" cy="103" r="5" fill="#EF4444" opacity="0.8"/>
  <circle cx="200" cy="103" r="5" fill="#F59E0B" opacity="0.8"/>
  <circle cx="220" cy="103" r="5" fill="#10B981" opacity="0.8"/>
  <text x="400" y="108" text-anchor="middle" fill="#94A3B8" font-family="monospace" font-size="12" letter-spacing="1">GYM TRACK // MEMBERSHIP &amp; ACCESS ENGINE</text>
  <!-- Membership Access Cards -->
  <g transform="translate(180, 150)">
    <!-- Active Member Card -->
    <rect x="0" y="0" width="210" height="110" rx="10" fill="#1E293B" stroke="#2563EB" stroke-width="1.5" />
    <circle cx="35" cy="35" r="18" fill="#2563EB" opacity="0.5"/>
    <text x="35" y="40" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-weight="bold" font-size="12">JD</text>
    <text x="65" y="32" fill="#FFFFFF" font-family="sans-serif" font-weight="bold" font-size="13">John Doe</text>
    <text x="65" y="48" fill="#38BDF8" font-family="monospace" font-size="10">PRO TIER • RFID-8910</text>
    <line x1="15" y1="68" x2="195" y2="68" stroke="#334155" stroke-width="1"/>
    <text x="15" y="92" fill="#94A3B8" font-family="monospace" font-size="10">Valid Until: Dec 2026</text>
    <rect x="145" y="78" width="50" height="18" rx="4" fill="#065F46"/>
    <text x="170" y="90" text-anchor="middle" fill="#34D399" font-family="sans-serif" font-size="9" font-weight="bold">ACTIVE</text>

    <!-- Expiring Member Card -->
    <rect x="230" y="0" width="210" height="110" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1.5" />
    <circle cx="265" cy="35" r="18" fill="#64748B" opacity="0.5"/>
    <text x="265" y="40" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-weight="bold" font-size="12">AS</text>
    <text x="295" y="32" fill="#FFFFFF" font-family="sans-serif" font-weight="bold" font-size="13">Anita Singh</text>
    <text x="295" y="48" fill="#F59E0B" font-family="monospace" font-size="10">BASIC • RFID-4021</text>
    <line x1="245" y1="68" x2="425" y2="68" stroke="#334155" stroke-width="1"/>
    <text x="245" y="92" fill="#94A3B8" font-family="monospace" font-size="10">Renewal in 4 days</text>
    <rect x="365" y="78" width="60" height="18" rx="4" fill="#78350F"/>
    <text x="395" y="90" text-anchor="middle" fill="#FBBF24" font-family="sans-serif" font-size="9" font-weight="bold">EXPIRING</text>
  </g>
  <!-- API Attendance Stream Bar -->
  <g transform="translate(180, 280)">
    <rect x="0" y="0" width="440" height="105" rx="8" fill="#111827" stroke="#334155" stroke-width="1"/>
    <text x="20" y="28" fill="#38BDF8" font-family="monospace" font-size="11">POST /api/v1/attendance/check-in • RFID-8910</text>
    <text x="20" y="46" fill="#94A3B8" font-family="monospace" font-size="10">Turnstile Unlocked • Access Authorized • Zone: Heavy Weights</text>
    <line x1="20" y1="60" x2="420" y2="60" stroke="#1F2937" stroke-width="1"/>
    <text x="20" y="80" fill="#34D399" font-family="monospace" font-size="11">POST /api/v1/trainer/schedule • Session: Functional Crossfit</text>
    <text x="20" y="96" fill="#94A3B8" font-family="monospace" font-size="10">Capacity: 12/15 Reserved • Slot Confirmed</text>
  </g>
</svg>
