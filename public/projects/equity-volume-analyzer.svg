<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="eva-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="60%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="eva-green" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
    <linearGradient id="eva-blue" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#1D4ED8" />
      <stop offset="100%" stop-color="#60A5FA" />
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#eva-bg)" rx="16"/>
  <!-- Financial Chart Axis Grid -->
  <g stroke="#334155" stroke-width="1" stroke-dasharray="4 4" opacity="0.4">
    <line x1="80" y1="120" x2="720" y2="120"/>
    <line x1="80" y1="200" x2="720" y2="200"/>
    <line x1="80" y1="280" x2="720" y2="280"/>
    <line x1="80" y1="360" x2="720" y2="360"/>
  </g>
  <!-- Main Frame -->
  <rect x="130" y="65" width="540" height="370" rx="14" fill="#0F172A" stroke="#334155" stroke-width="1.5" />
  <!-- Frame Header -->
  <rect x="130" y="65" width="540" height="46" rx="14" fill="#1E293B" />
  <circle cx="160" cy="88" r="5" fill="#EF4444" opacity="0.8"/>
  <circle cx="180" cy="88" r="5" fill="#F59E0B" opacity="0.8"/>
  <circle cx="200" cy="88" r="5" fill="#10B981" opacity="0.8"/>
  <text x="400" y="93" text-anchor="middle" fill="#94A3B8" font-family="monospace" font-size="12" letter-spacing="1">EQUITY VOLUME ANALYZER // EXCEL AUTOMATION ENGINE</text>

  <!-- Stock Volume Candlesticks and Bar Chart -->
  <g transform="translate(160, 130)">
    <!-- Column headers -->
    <rect x="0" y="0" width="480" height="28" rx="4" fill="#1E293B"/>
    <text x="15" y="18" fill="#94A3B8" font-family="monospace" font-size="10">PREV VOL (M-1)</text>
    <text x="130" y="18" fill="#94A3B8" font-family="monospace" font-size="10">CURR VOL (M)</text>
    <text x="250" y="18" fill="#38BDF8" font-family="monospace" font-size="10" font-weight="bold">SYMBOL</text>
    <text x="350" y="18" fill="#94A3B8" font-family="monospace" font-size="10">DELTA %</text>
    <text x="430" y="18" fill="#94A3B8" font-family="monospace" font-size="10">STATUS</text>

    <!-- Row 1: RELIANCE -->
    <rect x="0" y="35" width="480" height="32" rx="4" fill="#111827"/>
    <text x="15" y="55" fill="#CBD5E1" font-family="monospace" font-size="11">14,290,400</text>
    <text x="130" y="55" fill="#34D399" font-family="monospace" font-size="11">19,820,100</text>
    <text x="250" y="55" fill="#FFFFFF" font-family="monospace" font-size="11" font-weight="bold">RELIANCE</text>
    <text x="350" y="55" fill="#34D399" font-family="monospace" font-size="11">+38.69%</text>
    <rect x="420" y="41" width="50" height="18" rx="3" fill="#065F46"/>
    <text x="445" y="53" text-anchor="middle" fill="#34D399" font-family="sans-serif" font-size="9" font-weight="bold">SURGE</text>

    <!-- Row 2: HDFCBANK -->
    <rect x="0" y="73" width="480" height="32" rx="4" fill="#1E293B" opacity="0.6"/>
    <text x="15" y="93" fill="#CBD5E1" font-family="monospace" font-size="11">22,100,000</text>
    <text x="130" y="93" fill="#60A5FA" font-family="monospace" font-size="11">24,540,800</text>
    <text x="250" y="93" fill="#FFFFFF" font-family="monospace" font-size="11" font-weight="bold">HDFCBANK</text>
    <text x="350" y="93" fill="#60A5FA" font-family="monospace" font-size="11">+11.04%</text>
    <rect x="420" y="79" width="50" height="18" rx="3" fill="#1E3A8A"/>
    <text x="445" y="91" text-anchor="middle" fill="#93C5FD" font-family="sans-serif" font-size="9" font-weight="bold">STABLE</text>

    <!-- Row 3: INFY -->
    <rect x="0" y="111" width="480" height="32" rx="4" fill="#111827"/>
    <text x="15" y="131" fill="#CBD5E1" font-family="monospace" font-size="11">8,450,200</text>
    <text x="130" y="131" fill="#F87171" font-family="monospace" font-size="11">6,920,000</text>
    <text x="250" y="131" fill="#FFFFFF" font-family="monospace" font-size="11" font-weight="bold">INFY</text>
    <text x="350" y="131" fill="#F87171" font-family="monospace" font-size="11">-18.10%</text>
    <rect x="420" y="117" width="50" height="18" rx="3" fill="#7F1D1D"/>
    <text x="445" y="129" text-anchor="middle" fill="#FCA5A5" font-family="sans-serif" font-size="9" font-weight="bold">DECLINE</text>
  </g>

  <!-- Visual Volume Bar Visualization -->
  <g transform="translate(160, 290)">
    <rect x="0" y="0" width="480" height="120" rx="6" fill="#111827" stroke="#2563EB" stroke-width="1"/>
    <text x="20" y="24" fill="#94A3B8" font-family="monospace" font-size="10">SECTOR VOLUME DISTRIBUTION (WEEKLY RECAP)</text>
    <!-- Bar 1: Banking -->
    <rect x="30" y="40" width="30" height="60" rx="3" fill="url(#eva-blue)" />
    <text x="45" y="112" text-anchor="middle" fill="#64748B" font-family="sans-serif" font-size="9">BANK</text>
    <!-- Bar 2: IT -->
    <rect x="80" y="55" width="30" height="45" rx="3" fill="url(#eva-blue)" opacity="0.8"/>
    <text x="95" y="112" text-anchor="middle" fill="#64748B" font-family="sans-serif" font-size="9">IT</text>
    <!-- Bar 3: Energy (Highest) -->
    <rect x="130" y="30" width="30" height="70" rx="3" fill="url(#eva-green)" />
    <text x="145" y="112" text-anchor="middle" fill="#34D399" font-family="sans-serif" font-size="9">ENERGY</text>
    <!-- Bar 4: Auto -->
    <rect x="180" y="65" width="30" height="35" rx="3" fill="url(#eva-blue)" opacity="0.6"/>
    <text x="195" y="112" text-anchor="middle" fill="#64748B" font-family="sans-serif" font-size="9">AUTO</text>
    <!-- Live formula preview box -->
    <rect x="235" y="38" width="230" height="65" rx="4" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <text x="245" y="58" fill="#38BDF8" font-family="monospace" font-size="9">FORMULA: =IF(C2=0, 0, (D2-C2)/C2)</text>
    <text x="245" y="75" fill="#34D399" font-family="monospace" font-size="9">ENGINE: OpenPyXL Live Formula Injector</text>
    <text x="245" y="92" fill="#94A3B8" font-family="monospace" font-size="9">SAFE: ZeroDivision &amp; Duplicate Filtered</text>
  </g>
</svg>
