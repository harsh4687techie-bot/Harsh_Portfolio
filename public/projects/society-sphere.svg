<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="ss-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="ss-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#ss-bg)" rx="16"/>
  <!-- Subtle grid lines -->
  <g stroke="#334155" stroke-width="1" stroke-dasharray="4 6" opacity="0.3">
    <line x1="200" y1="0" x2="200" y2="500" />
    <line x1="400" y1="0" x2="400" y2="500" />
    <line x1="600" y1="0" x2="600" y2="500" />
  </g>
  <!-- Architectural residential building silhouettes in background -->
  <path d="M 120 400 L 120 220 L 220 220 L 220 400 Z" fill="#1E293B" opacity="0.4" />
  <path d="M 230 400 L 230 160 L 370 160 L 370 400 Z" fill="#1E293B" opacity="0.6" />
  <path d="M 380 400 L 380 200 L 500 200 L 500 400 Z" fill="#1E293B" opacity="0.5" />
  <path d="M 510 400 L 510 250 L 620 250 L 620 400 Z" fill="#1E293B" opacity="0.3" />
  
  <!-- SocietySphere Interface Frame -->
  <rect x="150" y="80" width="500" height="340" rx="14" fill="#0F172A" stroke="#334155" stroke-width="1.5" />
  <!-- Frame Header -->
  <rect x="150" y="80" width="500" height="46" rx="14" fill="#1E293B" />
  <circle cx="180" cy="103" r="5" fill="#EF4444" opacity="0.8"/>
  <circle cx="200" cy="103" r="5" fill="#F59E0B" opacity="0.8"/>
  <circle cx="220" cy="103" r="5" fill="#10B981" opacity="0.8"/>
  <text x="400" y="108" text-anchor="middle" fill="#94A3B8" font-family="monospace" font-size="12" letter-spacing="1">SOCIETYSPHERE // MAINTENANCE &amp; BILLING</text>

  <!-- Metrics row -->
  <g transform="translate(180, 145)">
    <!-- Metric 1: Collection Rate -->
    <rect x="0" y="0" width="135" height="75" rx="8" fill="#1E293B" stroke="#2563EB" stroke-width="1.5" />
    <text x="15" y="24" fill="#94A3B8" font-family="sans-serif" font-size="10">COLLECTION RATE</text>
    <text x="15" y="55" fill="#38BDF8" font-family="monospace" font-size="22" font-weight="bold">94.8%</text>

    <!-- Metric 2: Monthly Dues -->
    <rect x="150" y="0" width="140" height="75" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <text x="165" y="24" fill="#94A3B8" font-family="sans-serif" font-size="10">DUES SETTLED</text>
    <text x="165" y="55" fill="#34D399" font-family="monospace" font-size="22" font-weight="bold">₹4,28,000</text>

    <!-- Metric 3: Active Units -->
    <rect x="305" y="0" width="135" height="75" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1" />
    <text x="320" y="24" fill="#94A3B8" font-family="sans-serif" font-size="10">OCCUPIED FLATS</text>
    <text x="320" y="55" fill="#FFFFFF" font-family="monospace" font-size="22" font-weight="bold">128/132</text>
  </g>

  <!-- Resident Maintenance Ledger List -->
  <g transform="translate(180, 240)">
    <rect x="0" y="0" width="440" height="150" rx="8" fill="#111827" stroke="#334155" stroke-width="1"/>
    <!-- Row 1 -->
    <text x="20" y="32" fill="#E2E8F0" font-family="monospace" font-size="11">A-402 • Sharma, R. • Maintenance + Water</text>
    <rect x="330" y="18" width="90" height="22" rx="4" fill="#065F46"/>
    <text x="375" y="33" text-anchor="middle" fill="#34D399" font-family="sans-serif" font-size="10" font-weight="bold">PAID (UPI)</text>
    <line x1="20" y1="50" x2="420" y2="50" stroke="#1F2937" stroke-width="1"/>

    <!-- Row 2 -->
    <text x="20" y="78" fill="#E2E8F0" font-family="monospace" font-size="11">B-201 • Kulkarni, S. • Quarterly Maintenance</text>
    <rect x="330" y="64" width="90" height="22" rx="4" fill="#065F46"/>
    <text x="375" y="79" text-anchor="middle" fill="#34D399" font-family="sans-serif" font-size="10" font-weight="bold">PAID (NET)</text>
    <line x1="20" y1="96" x2="420" y2="96" stroke="#1F2937" stroke-width="1"/>

    <!-- Row 3 -->
    <text x="20" y="124" fill="#E2E8F0" font-family="monospace" font-size="11">C-104 • Verma, A. • Maintenance Outstanding</text>
    <rect x="330" y="110" width="90" height="22" rx="4" fill="#78350F"/>
    <text x="375" y="125" text-anchor="middle" fill="#FBBF24" font-family="sans-serif" font-size="10" font-weight="bold">DUE 3 DAYS</text>
  </g>
</svg>
