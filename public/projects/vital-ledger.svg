<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="vl-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="60%" stop-color="#1E1E38" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="vl-red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E" />
      <stop offset="100%" stop-color="#E11D48" />
    </linearGradient>
    <linearGradient id="vl-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#vl-bg)" rx="16"/>
  <!-- Subtle grid lines -->
  <g stroke="#334155" stroke-width="1" stroke-dasharray="4 6" opacity="0.25">
    <line x1="200" y1="0" x2="200" y2="500" />
    <line x1="400" y1="0" x2="400" y2="500" />
    <line x1="600" y1="0" x2="600" y2="500" />
    <line x1="0" y1="250" x2="800" y2="250" />
  </g>
  <!-- ECG / Pulse Line Across Background -->
  <path d="M 50 250 L 220 250 L 240 210 L 260 290 L 280 180 L 305 320 L 325 250 L 750 250" fill="none" stroke="#2563EB" stroke-width="2.5" opacity="0.4" />
  <!-- Central Glass Dashboard -->
  <rect x="150" y="80" width="500" height="340" rx="14" fill="#0F172A" stroke="#334155" stroke-width="1.5" />
  <!-- Header -->
  <rect x="150" y="80" width="500" height="46" rx="14" fill="#1E293B" />
  <circle cx="180" cy="103" r="5" fill="#EF4444" opacity="0.8"/>
  <circle cx="200" cy="103" r="5" fill="#F59E0B" opacity="0.8"/>
  <circle cx="220" cy="103" r="5" fill="#10B981" opacity="0.8"/>
  <text x="400" y="108" text-anchor="middle" fill="#94A3B8" font-family="monospace" font-size="12" letter-spacing="1">VITAL LEDGER // BLOOD BANK MANAGEMENT</text>
  <!-- Blood Group Inventory Cells -->
  <g transform="translate(180, 150)">
    <!-- O+ Cell -->
    <rect x="0" y="0" width="95" height="110" rx="8" fill="#1E293B" stroke="#F43F5E" stroke-width="1.5"/>
    <text x="47" y="32" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-weight="bold" font-size="20">O+</text>
    <path d="M 47 48 C 37 60 35 70 47 80 C 59 70 57 60 47 48 Z" fill="url(#vl-red)"/>
    <text x="47" y="100" text-anchor="middle" fill="#34D399" font-family="monospace" font-size="10">84 UNITS</text>
    <!-- A+ Cell -->
    <rect x="115" y="0" width="95" height="110" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
    <text x="162" y="32" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-weight="bold" font-size="20">A+</text>
    <path d="M 162 48 C 152 60 150 70 162 80 C 174 70 172 60 162 48 Z" fill="url(#vl-blue)"/>
    <text x="162" y="100" text-anchor="middle" fill="#94A3B8" font-family="monospace" font-size="10">62 UNITS</text>
    <!-- B+ Cell -->
    <rect x="230" y="0" width="95" height="110" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
    <text x="277" y="32" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-weight="bold" font-size="20">B+</text>
    <path d="M 277 48 C 267 60 265 70 277 80 C 289 70 287 60 277 48 Z" fill="url(#vl-blue)"/>
    <text x="277" y="100" text-anchor="middle" fill="#94A3B8" font-family="monospace" font-size="10">45 UNITS</text>
    <!-- AB- Cell (Low stock warning) -->
    <rect x="345" y="0" width="95" height="110" rx="8" fill="#1E293B" stroke="#F59E0B" stroke-width="1.5"/>
    <text x="392" y="32" text-anchor="middle" fill="#FFFFFF" font-family="sans-serif" font-weight="bold" font-size="20">AB-</text>
    <path d="M 392 48 C 382 60 380 70 392 80 C 404 70 402 60 392 48 Z" fill="#F59E0B"/>
    <text x="392" y="100" text-anchor="middle" fill="#F59E0B" font-family="monospace" font-size="10">CRITICAL: 4</text>
  </g>
  <!-- Lower Real-Time Log / Flask Service Banner -->
  <g transform="translate(180, 280)">
    <rect x="0" y="0" width="440" height="110" rx="8" fill="#111827" stroke="#2563EB" stroke-width="1"/>
    <circle cx="20" cy="25" r="4" fill="#34D399"/>
    <text x="35" y="28" fill="#E2E8F0" font-family="monospace" font-size="11">DISPATCH #8921 • Apollo Hospital • 4x O+ Units</text>
    <line x1="20" y1="42" x2="420" y2="42" stroke="#1F2937" stroke-width="1"/>
    <circle cx="20" cy="60" r="4" fill="#60A5FA"/>
    <text x="35" y="63" fill="#94A3B8" font-family="monospace" font-size="11">DONOR REGISTERED • Verified Anti-body Screen OK</text>
    <line x1="20" y1="77" x2="420" y2="77" stroke="#1F2937" stroke-width="1"/>
    <circle cx="20" cy="95" r="4" fill="#F59E0B"/>
    <text x="35" y="98" fill="#FCD34D" font-family="monospace" font-size="11">LOW-STOCK TRIGGER • Auto-Notification sent to Registered Donors</text>
  </g>
</svg>
