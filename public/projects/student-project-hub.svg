<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="sph-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="60%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="sph-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="sph-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.05" />
    </linearGradient>
  </defs>
  <rect width="800" height="500" fill="url(#sph-bg)" rx="16"/>
  <!-- Subtle grid lines -->
  <g stroke="#334155" stroke-width="1" stroke-dasharray="4 6" opacity="0.3">
    <line x1="100" y1="0" x2="100" y2="500" />
    <line x1="200" y1="0" x2="200" y2="500" />
    <line x1="300" y1="0" x2="300" y2="500" />
    <line x1="400" y1="0" x2="400" y2="500" />
    <line x1="500" y1="0" x2="500" y2="500" />
    <line x1="600" y1="0" x2="600" y2="500" />
    <line x1="700" y1="0" x2="700" y2="500" />
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="400" x2="800" y2="400" />
  </g>
  <!-- Main IDE / Hub Frame -->
  <rect x="140" y="80" width="520" height="340" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1.5" />
  <!-- Frame Header -->
  <path d="M 140 92 Q 140 80 152 80 L 648 80 Q 660 80 660 92 L 660 120 L 140 120 Z" fill="#0F172A" />
  <circle cx="170" cy="100" r="5" fill="#EF4444" opacity="0.8" />
  <circle cx="190" cy="100" r="5" fill="#F59E0B" opacity="0.8" />
  <circle cx="210" cy="100" r="5" fill="#10B981" opacity="0.8" />
  <text x="400" y="104" text-anchor="middle" fill="#94A3B8" font-family="monospace" font-size="12" letter-spacing="1">STUDENT-PROJECT-HUB // AUTH &amp; REPO</text>
  <!-- Tree / Repo Sidebar -->
  <rect x="160" y="140" width="140" height="260" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
  <rect x="175" y="160" width="80" height="10" rx="3" fill="#2563EB" opacity="0.8"/>
  <rect x="190" y="185" width="90" height="8" rx="2" fill="#64748B"/>
  <rect x="190" y="205" width="70" height="8" rx="2" fill="#64748B"/>
  <rect x="190" y="225" width="85" height="8" rx="2" fill="#38BDF8"/>
  <rect x="175" y="255" width="70" height="10" rx="3" fill="#2563EB" opacity="0.8"/>
  <rect x="190" y="280" width="95" height="8" rx="2" fill="#64748B"/>
  <rect x="190" y="300" width="60" height="8" rx="2" fill="#64748B"/>
  <rect x="190" y="320" width="80" height="8" rx="2" fill="#64748B"/>
  <!-- Branching Graph / Submission Nodes -->
  <g transform="translate(330, 140)">
    <!-- Branch Lines -->
    <path d="M 60 50 L 150 50 Q 180 50 180 80 L 180 120 Q 180 150 210 150 L 270 150" fill="none" stroke="url(#sph-blue)" stroke-width="3" />
    <path d="M 180 80 Q 180 110 150 110 L 90 110" fill="none" stroke="#64748B" stroke-width="2" stroke-dasharray="4 4" />
    <path d="M 60 50 L 60 210 L 270 210" fill="none" stroke="#2563EB" stroke-width="2.5" />
    <!-- Node circles -->
    <circle cx="60" cy="50" r="10" fill="#2563EB" stroke="#DBEAFE" stroke-width="3" />
    <circle cx="180" cy="80" r="8" fill="#38BDF8" stroke="#DBEAFE" stroke-width="2" />
    <circle cx="270" cy="150" r="12" fill="#10B981" stroke="#A7F3D0" stroke-width="3" />
    <circle cx="60" cy="210" r="8" fill="#64748B" stroke="#CBD5E1" stroke-width="2" />
    <circle cx="270" cy="210" r="10" fill="#2563EB" stroke="#DBEAFE" stroke-width="2" />
    <!-- Badge / Status Card -->
    <rect x="130" y="180" width="130" height="50" rx="6" fill="#0F172A" stroke="#2563EB" stroke-width="1.5"/>
    <text x="145" y="202" fill="#38BDF8" font-family="monospace" font-size="11" font-weight="bold">STATUS: REVIEWED</text>
    <text x="145" y="218" fill="#94A3B8" font-family="sans-serif" font-size="10">Role: Faculty Evaluator</text>
  </g>
  <!-- Floating Graduation / Academic Cap Icon Accent -->
  <g transform="translate(560, 105)" opacity="0.9">
    <path d="M 40 10 L 75 25 L 40 40 L 5 25 Z" fill="url(#sph-blue)" />
    <path d="M 20 32 L 20 50 Q 40 60 60 50 L 60 32" fill="none" stroke="#38BDF8" stroke-width="2.5" />
    <path d="M 75 25 L 75 48" stroke="#F59E0B" stroke-width="2" />
  </g>
</svg>
